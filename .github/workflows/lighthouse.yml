# ============================================================
# VICTA — Lighthouse CI on Vercel Preview Deployments
#
# NOTE: This workflow WILL NOT RUN until Wave 2 because:
#   (a) Vercel must be connected to this GitHub repo
#   (b) Vercel preview deployments must be enabled on PRs
#   (c) GitHub Actions Secrets must be set:
#       - LHCI_GITHUB_APP_TOKEN (optional — for PR status checks)
# First expected run: Wave 2 / Phase 1 scaffold PR.
#
# Targets (mobile, simulated throttling):
#   Performance  >= 90
#   Accessibility >= 90
#   Best Practices >= 90
#   SEO >= 90
#
# Checked URLs:
#   /cs/             — homepage (primary locale)
#   /cs/spoluprace/  — pricing / services page
#
# Why these two? They are the highest-traffic pages and the
# ones with the most third-party embeds (Cal.com iframe on
# /cs/spoluprace/). If these pass mobile Lighthouse, all
# simpler pages will pass too.
# ============================================================

name: Lighthouse CI

on:
  # Triggers when Vercel posts a deployment status event.
  # The deployment_status event fires for both preview and
  # production deployments. We filter to preview only below.
  deployment_status:

jobs:
  lighthouse:
    name: Lighthouse Mobile Audit
    runs-on: ubuntu-latest

    # Only run on successful Vercel preview deployments.
    # deployment_status.state == 'success' avoids running on
    # pending/error states. environment_url is the preview URL.
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Lighthouse CI against Vercel preview
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Audit the two highest-priority pages on the preview URL.
          # Vercel sets the preview URL in deployment_status.target_url.
          urls: |
            ${{ github.event.deployment_status.target_url }}/cs/
            ${{ github.event.deployment_status.target_url }}/cs/spoluprace/
          # Mobile-first audit configuration.
          # formFactor: mobile + simulated throttling matches real-world
          # conditions for CZ/SK B2B audience on mid-range devices.
          configPath: '.lighthouserc.json'
          # Upload results to temporary public storage for PR review.
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

